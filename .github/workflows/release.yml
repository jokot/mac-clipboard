# Release flow:
# 1. A merge to main runs release-please. It opens or updates the release PR
#    ("chore(main): release x.y.z") with CHANGELOG.md and the new version.
#    sync-build then sets the build number and the Xcode project on the open
#    release PR. release-pr-build builds the DMG from that commit and shows
#    the result as the "release-pr-build" check on the release PR.
# 2. A merge of the release PR leaves it labeled "autorelease: pending".
#    find-release sees that PR. release builds the DMG from the merge commit,
#    then publish.sh makes a hidden draft, attaches the DMG, its .sha256 and
#    a copy named MaClip.dmg (for the website link), and publishes it. Only the publish creates the tag. If any step fails, nothing is
#    public, and a re-run of the failed job continues.
# PRs to main run pr-build, which uploads the DMG as a workflow artifact.
# The website in site/ is not part of the app. release-please skips commits
# that change only site/ (exclude-paths), and those PRs do not run pr-build.
# The release PR changes only the files in paths-ignore, so it does not run
# pr-build. Each change to the release PR is two pushes (release-please, then
# sync-build). Each push would start a run, and GitHub asks for an approval
# of each run that github-actions[bot] starts. The first run would also fail,
# because the Xcode project still has the old version.
#
# Push runs share one concurrency group, so they run one at a time. GitHub
# keeps one waiting run per group: a third merge cancels the waiting run.
# That is harmless, because each run reads the current state of main.
name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The release PR changes only these files. A PR that changes only these
    # files does not run pr-build.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - project.yml
      - MacClipboard.xcodeproj/project.pbxproj
      # The website. Cloudflare Pages deploys it. It does not change the app.
      - site/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  find-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.find.outputs.pr }}
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        name: Find a merged release PR that waits for its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_json="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main \
            --label "autorelease: pending" --json number,mergeCommit \
            --jq 'sort_by(.number) | first // empty')"
          if [ -z "$pr_json" ]; then
            echo "No merged release PR waits for a release."
            exit 0
          fi
          pr="$(jq -r '.number' <<<"$pr_json")"
          sha="$(jq -r '.mergeCommit.oid' <<<"$pr_json")"
          version="$(git show "$sha:.release-please-manifest.json" | jq -r '."."')"
          echo "Release PR #$pr, commit $sha, version $version"
          {
            echo "pr=$pr"
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: find-release
    if: needs.find-release.outputs.pr != ''
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      PR: ${{ needs.find-release.outputs.pr }}
      SHA: ${{ needs.find-release.outputs.sha }}
      VERSION: ${{ needs.find-release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Build DMG
        run: scripts/release/build-dmg.sh "$VERSION"
      - name: Publish the release
        run: scripts/release/publish.sh "$VERSION" "$SHA" "$PR"

  release-please:
    needs: [find-release, release]
    # Runs after a release, or when there was nothing to release. After a
    # failed release, release-please would only log "untagged, merged release
    # PRs outstanding", so the job is skipped.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # release-please sets the "autorelease: pending" label on its PR.
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The release job creates tags and releases, after the DMG is built.
          skip-github-release: true

  sync-build:
    needs: release-please
    # release-please needs release, which is skipped when nothing waits for a
    # release. Without a status function, GitHub skips every job after a
    # skipped job, so this condition must check the results itself.
    if: ${{ !cancelled() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      # release-please sets its "pr" output only when it creates or changes the
      # release PR. Find the open release PR here, so a run also repairs a PR
      # that release-please did not change.
      - id: find
        name: Find the open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
            --label "autorelease: pending" --json headRefName \
            --jq 'sort_by(.number) | first | .headRefName // empty')"
          if [ -z "$branch" ]; then
            echo "No open release PR."
          else
            echo "Release PR branch: $branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.find.outputs.branch != ''
        with:
          ref: ${{ steps.find.outputs.branch }}
          fetch-depth: 0
      - id: sync
        name: Set build number and sync the Xcode project
        if: steps.find.outputs.branch != ''
        env:
          BRANCH: ${{ steps.find.outputs.branch }}
        run: |
          # The manifest on main holds the last released version. On the
          # release branch, release-please has already changed it.
          last_tag="v$(git show origin/main:.release-please-manifest.json | jq -r '."."')"
          scripts/release/sync-version.sh "$last_tag"
          if git diff --quiet; then
            echo "Build number is already correct."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(release): set build number"
            git push origin "HEAD:$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-pr-build:
    needs: sync-build
    if: ${{ !cancelled() && needs.sync-build.outputs.sha != '' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      SHA: ${{ needs.sync-build.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Show the check as pending on the release PR
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending \
            -f context=release-pr-build -f description="Building the DMG" -f target_url="$RUN_URL"
      - name: Read version
        id: version
        run: |
          v="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*([0-9][0-9.]*).*/\1/p' project.yml | head -1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/build-dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MacClip-dmg-release-pr
          path: dist/MacClip-*
          retention-days: 7
          if-no-files-found: error
      - name: Show the result on the release PR
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; text="The DMG builds" ;;
            failure) state=failure; text="The DMG build failed" ;;
            *) state=error; text="The DMG build was cancelled" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" \
            -f context=release-pr-build -f description="$text" -f target_url="$RUN_URL"

  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          v="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*([0-9][0-9.]*).*/\1/p' project.yml | head -1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release/build-dmg.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MacClip-dmg
          path: dist/MacClip-*
          retention-days: 7
          if-no-files-found: error
